<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Media Grabber</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="titles">
        <h1>Media Grabber</h1>
        <p id="count">正在读取…</p>
      </div>
      <button id="clear" type="button" disabled>清空</button>
    </header>
    <label class="option" for="separate-media">
      <input id="separate-media" type="checkbox" />
      分开保存视频和音频
    </label>
    <p id="banner" class="banner" hidden></p>
    <p id="empty" class="empty" hidden>当前页面还没有发现音视频。播放一下，或刷新后再打开看看。</p>
    <ul id="list" class="list"></ul>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
